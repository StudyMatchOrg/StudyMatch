spring.application.name=studymatch
spring.config.import=optional:file:.env[.properties]

# Database connection. Override with environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/studymatch?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}

# Sprint 1: the schema is generated from the entities. To be replaced by Flyway migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false


# Demo data for the Sprint 2 review (degrees, course units, competencies and demo students).
# It is only added when missing. Set DEMO_DATA=false to start with an empty database.
studymatch.demo-data.enabled=${DEMO_DATA:true}
