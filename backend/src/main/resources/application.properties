spring.application.name=studymatch

# Database connection. Override with environment variables; the defaults match the
# local development setup described in the README.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/studymatch}
spring.datasource.username=${DB_USERNAME:studymatch}
spring.datasource.password=${DB_PASSWORD:studymatch}

# Sprint 1: the schema is generated from the entities. To be replaced by Flyway migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
