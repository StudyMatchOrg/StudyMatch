spring.application.name=studymatch

spring.config.import=optional:file:.env[.properties]

# Database connection. Override with environment variables
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/studymatch?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}

# Sprint 1 schema generated automatically from entities
spring.jpa.open-in-view=false

# Adds demo data if missing or set DEMO_DATA=false to start empty
studymatch.demo-data.enabled=${DEMO_DATA:true}