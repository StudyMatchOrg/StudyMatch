spring.application.name=studymatch

# Tests run against an in-memory H2 database, so no MySQL installation is needed.
spring.datasource.url=jdbc:h2:mem:studymatch;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
studymatch.demo-data.enabled=false
